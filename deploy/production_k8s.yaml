# ==============================================================================
# STRATA ENTERPRISE CLOUD ARCHITECTURE: deploy/production_k8s.yaml
# Production Declarative Orchestration Blueprint for High-Scale Clusters
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-core-microservice
  namespace: production
  labels:
    tier: systems-core
    engine: strata-v1.0.0
spec:
  replicas: 5 # High-scale compute scaling group
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: strata-engine
  template:
    metadata:
      labels:
        app: strata-engine
    spec:
      containers:
      - name: strata-runtime-container
        image: prabathkumar/strata-core:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 # High-Volume Asynchronous Stream Ingestion Port
        - containerPort: 443  # Encrypted Layer-7 Native TLS Handshake Port
        resources:
          limits:
            cpu: "2"
            memory: "512Mi" # Low-overhead memory cap (Strata runs on 4KB Fibers)
          requests:
            cpu: "500m"
            memory: "128Mi"
        livenessProbe:
          exec:
            command: ["strata", "check", "examples/microservice_template.sta"]
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: strata-core-lb
  namespace: production
spec:
  type: LoadBalancer
  ports:
  - name: secure-tls
    port: 443
    targetPort: 443
  - name: stream-ingest
    port: 8080
    targetPort: 8080
  selector:
    app: strata-engine
