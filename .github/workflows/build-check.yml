name: Strata Compiler Conformance & CI/CD Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-conformance:
    name: Execute Core Architectural Verification Passes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Initialize Foundation Environment Shell
      run: chmod +x bin/strata

    # The conformance suite is the compiler's own regression gate: E001-E006
    # plus end-to-end compile-and-run. It exits non-zero on any failure.
    # A file can exist locally, be required by every build, and never reach
    # the repository. This runs the suite inside an export of HEAD, which is
    # exactly what a clone gets, so an untracked dependency fails here rather
    # than mystifying everyone when every other step goes red at once.
    - name: Committed Tree Builds
      run: python3 test_suite/clean_checkout.py

    - name: Run Conformance Suite
      run: python3 test_suite/conformance.py

    # Compiles every fenced code block in README.md and
    # LANGUAGE_SPECIFICATION.md. Fails when documentation drifts away from
    # what the compiler actually accepts.
    - name: Verify Documentation Examples
      run: python3 test_suite/doc_examples.py

    # The stdlib must parse with the compiler that ships alongside it.
    # Stage 1 of self-hosting: the Strata-written lexer must produce a
    # byte-identical token stream to the Python lexer across the whole corpus.
    - name: Lexer Differential (Strata vs Python oracle)
      run: python3 test_suite/lexer_diff.py

    # The backend C compiler is part of the toolchain, and gcc and clang
    # disagree: clang 16+ rejects implicit function declarations that gcc only
    # warns about. Running the suites under both is what catches that, and it
    # is why this job previously passed locally and failed here.
    # Stage 2 of self-hosting: the Strata-written parser must produce an
    # identical syntax tree to the Python parser.
    - name: Parser Differential (Strata vs Python oracle)
      run: python3 test_suite/parser_diff.py

    # Stage 3 of self-hosting: the Strata-written type checker must emit the
    # same diagnostics — codes, locations, messages and order — as the oracle,
    # over clean code and over one deliberately broken program per rule.
    - name: Type Checker Differential (Strata vs Python oracle)
      run: python3 test_suite/typecheck_diff.py

    # Stage 4: emitted C compared byte for byte.
    - name: Code Generator Differential (Strata vs Python oracle)
      run: python3 test_suite/codegen_diff.py

    # The proof that the bootstrap can be retired: the Strata front end,
    # rebuilt from C it generated itself, reproduces that C exactly.
    - name: Self-Hosting Fixpoint
      run: python3 test_suite/fixpoint.py

    - name: Conformance Under clang
      run: STRATA_CC=clang python3 test_suite/conformance.py

    - name: Documentation Under clang
      run: STRATA_CC=clang python3 test_suite/doc_examples.py

    # The wasm backend needs clang with a wasm32 target, which the runner has
    # and a gcc-only machine does not. The suite skips there and runs here.
    - name: WebAssembly Target
      run: python3 test_suite/wasm_target.py

    # The language's own test blocks, run rather than only type-checked.
    - name: Run Strata Verify Blocks
      run: ./bin/strata test test_suite/verify_cases

    # Parsing was the old claim and it was not worth making: seven modules
    # parsed fine and failed at the C linker. This builds and runs them.
    - name: Standard Library Compiles, Links And Runs
      run: python3 test_suite/stdlib_compiles.py

    # A formatter nobody runs is a formatter that drifts. This fails the build
    # if any tracked source is not in canonical form.
    - name: Source Is Canonically Formatted
      run: |
        ./bin/strata fmt --check $(find std compiler examples test_suite \
          -name '*.sta' -not -path '*unimplemented*')

    - name: Formatting Preserves Meaning
      run: python3 test_suite/fmt.py

    # A project builds as a project, and the service it produces serves.
    - name: Project Builds And The Service Serves
      run: python3 test_suite/project_build.py

    # The whole journey, not its parts: sign in, look, create, close, sign out,
    # and be refused afterwards.
    - name: Journey — Run The Orders Desk
      run: python3 test_suite/journey_orders.py

    # The second journey: a developer clones, adds a column, watches the build
    # break at every insert, lets the repair loop close it, and finds the data
    # written before the change still loads. It runs against an export of HEAD,
    # so it is what a clone gets.
    - name: Journey — Change The System
      run: python3 test_suite/journey_change.py

    # The third journey: two clients at once, a slow client, a client that
    # walks away, a malformed request, ten writes arriving together, a restart
    # with live data, and 2000 rows. It prints the measured numbers.
    - name: Journey — Survive Contact
      run: python3 test_suite/journey_survive.py

    # A second, differently-shaped application: a command-line tool that also
    # answers JSON, with no pages, no forms and no session. It is the check
    # that the language is not shaped by its only program.
    - name: The Second Application
      run: python3 test_suite/journey_ledger.py

    # Stage 10: could anyone run this? One line per request on stdout, a form
    # from somewhere else refused, a guessed password locking the account, and
    # a flood answered 503 rather than forked.
    - name: Journey — Operate It
      run: python3 test_suite/journey_operate.py

    # The repair loop reads the compiler's JSON diagnostics. Every change to a
    # diagnostic's shape is a chance to break it silently, so the contract is
    # checked here rather than discovered in a demo.
    - name: Autonomous Repair Loop
      run: python3 test_suite/self_repair.py

    - name: Reject Unimplemented Tools On PATH
      run: |
        allowed="strata strata-lexer strata-parser unimplemented"
        fail=0
        for f in bin/*; do
          name=$(basename "$f")
          case " $allowed " in
            *" $name "*) ;;
            *) echo "::error file=$f::$name is not an approved tool; stubs belong in bin/unimplemented/"; fail=1 ;;
          esac
        done
        exit $fail

    - name: Reject Forged Checksums In Lockfile
      run: |
        if grep -q "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" Strata.lock; then
          echo "::error file=Strata.lock::contains the SHA-256 of the empty string"
          exit 1
        fi

    # The image is built and the service inside it is asked for a page. The
    # previous step here checked that a Dockerfile existed — and the one that
    # existed cloned "https://github.com" and built CPython. Checking that a
    # file is present is not checking that it works.
    - name: Image Builds And The Container Serves
      run: |
        docker build -t strata-orders:ci .
        docker run -d --name orders-ci -p 8080:8080 strata-orders:ci
        for i in $(seq 1 30); do
          if curl -fsS -o /dev/null http://127.0.0.1:8080/login; then ok=1; break; fi
          sleep 1
        done
        if [ "${ok:-0}" != "1" ]; then
          echo "::error::the container did not serve /login within 30s"
          docker logs orders-ci || true
          exit 1
        fi
        curl -fsS http://127.0.0.1:8080/login | grep -q "password" \
          || { echo "::error::/login did not render the sign-in form"; exit 1; }
        docker rm -f orders-ci
