name: Strata Continuous Validation & Compilation Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  strata-compiler-validation:
    name: Execute Core Architectural Verification Passes
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the source directory tree into the virtual machine sandbox
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Initialize standard baseline system execution shells
    - name: Setup System Shell Environment
      run: |
        echo "[CI Pipeline]: Verification loops initializing..."
        chmod +x test_compiler.sh

    # Step 3: Launch Strata's custom automated CLI execution test suite
    - name: Execute Strata Toolchain Safety Validations
      run: |
        echo "[CI Pipeline]: Triggering Strata Token Parser & AST Validation Pass..."
        ./test_compiler.sh

    # Step 4: Verify the Multi-Stage Production Container Engine Build
    - name: Docker Blueprint Validation Check
      run: |
        echo "[CI Pipeline]: Auditing Dockerfile structural build constraints..."
        if [ ! -f Dockerfile ]; then
          echo "!!! [CI Error]: Missing primary production containerization blueprints."
          exit 1
        fi
        echo "[SUCCESS]: Docker deployment parameters validated."
