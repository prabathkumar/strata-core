name: Strata Compiler Conformance & CI/CD Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-conformance:
    name: Execute Core Architectural Verification Passes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Initialize Foundation Environment Shell
      run: chmod +x bin/strata

    # The conformance suite is the compiler's own regression gate: E001-E006
    # plus end-to-end compile-and-run. It exits non-zero on any failure.
    - name: Run Conformance Suite
      run: python3 test_suite/conformance.py

    # Compiles every fenced code block in README.md and
    # LANGUAGE_SPECIFICATION.md. Fails when documentation drifts away from
    # what the compiler actually accepts.
    - name: Verify Documentation Examples
      run: python3 test_suite/doc_examples.py

    # The stdlib must parse with the compiler that ships alongside it.
    # Stage 1 of self-hosting: the Strata-written lexer must produce a
    # byte-identical token stream to the Python lexer across the whole corpus.
    - name: Lexer Differential (Strata vs Python oracle)
      run: python3 test_suite/lexer_diff.py

    - name: Verify Standard Library Parses
      run: |
        fail=0
        for f in std/*.sta; do
          if ! python3 -c "
        import sys; sys.path.insert(0, '.')
        from bootstrap.stage0 import parse_file
        parse_file('$f')
        " 2>/dev/null; then
            echo "::error file=$f::std module does not parse"
            fail=1
          fi
        done
        exit $fail

    # bin/ previously contained twelve scripts that printed success without
    # doing the work they claimed. This fails the build if one returns to PATH.
    - name: Reject Unimplemented Tools On PATH
      run: |
        allowed="strata strata-lexer strata-parser unimplemented"
        fail=0
        for f in bin/*; do
          name=$(basename "$f")
          case " $allowed " in
            *" $name "*) ;;
            *) echo "::error file=$f::$name is not an approved tool; stubs belong in bin/unimplemented/"; fail=1 ;;
          esac
        done
        exit $fail

    - name: Reject Forged Checksums In Lockfile
      run: |
        if grep -q "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" Strata.lock; then
          echo "::error file=Strata.lock::contains the SHA-256 of the empty string"
          exit 1
        fi

    - name: Validate Containerization Infrastructure Blueprints
      run: |
        if [ ! -f Dockerfile ] || [ ! -f deploy/production_k8s.yaml ]; then
          echo "::error::Core deployment architecture assets missing from project tree."
          exit 1
        fi
        echo "[SUCCESS]: Automated CI/CD validation sweep settled with 0 anomalies found."
