name: Strata Compiler Conformance & CI/CD Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-conformance:
    name: Execute Core Architectural Verification Passes
    runs-on: ubuntu-latest

    steps:
    # Step 1: Securely checkout the complete workspace code tree layout
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Setup system environment execution permissions
    - name: Initialize Foundation Environment Shell
      run: |
        echo "[CI Pipeline]: Initializing secure non-Python validation loop..."
        chmod +x bin/strata bin/strata-lexer bin/strata-parser bin/strata-checker bin/strata-codegen bin/strata-test bin/strata-errors bin/strata-debug bin/strata-deploy bin/strata-sync

    # Step 3: Trigger the full local automated regression test suite script
    - name: Run Toolchain Regression Test Matrix
      run: |
        echo "[CI Pipeline]: Triggering Lexer -> Parser -> Checker -> Codegen Validation Pass..."
        ./bin/strata test

    # Step 4: Verify explicit compilation against the formal conformance target
    - name: Execute Language Conformance Verification
      run: |
        echo "[CI Pipeline]: Compiling conformance test specifications..."
        ./bin/strata build test_suite/conformance_tests.sta --target=wasm

    # Step 5: Audit multi-stage production deployment scripts
    - name: Validate Containerization Infrastructure Blueprints
      run: |
        echo "[CI Pipeline]: Auditing production Dockerfile and Kubernetes manifests..."
        if [ ! -f Dockerfile ] || [ ! -f deploy/production_k8s.yaml ]; then
          echo "!!! [CI Error]: Core deployment architecture assets missing from project tree."
          exit 1
        fi
        echo "[SUCCESS]: Automated CI/CD validation sweep settled with 0 anomalies found."
