name: Strata Compiler Conformance & CI/CD Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-conformance:
    name: Execute Core Architectural Verification Passes
    runs-on: ubuntu-latest

    # A real PostgreSQL for the database journey. Without one that journey
    # skips its database half, and a suite that reports OK having done nothing
    # is worse than no suite -- so CI provides the database rather than
    # letting the skip become the normal result.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Initialize Foundation Environment Shell
      run: chmod +x bin/strata

    # std/postgres.sta declares `foreign "libpq-fe.h"`, so the headers must be
    # present before anything compiles the standard library -- not only before
    # the database journey, which runs near the end.
    - name: Install The PostgreSQL Client Headers
      run: sudo apt-get update && sudo apt-get install -y libpq-dev

    # The conformance suite is the compiler's own regression gate: E001-E006
    # plus end-to-end compile-and-run. It exits non-zero on any failure.
    # A file can exist locally, be required by every build, and never reach
    # the repository. This runs the suite inside an export of HEAD, which is
    # exactly what a clone gets, so an untracked dependency fails here rather
    # than mystifying everyone when every other step goes red at once.
    - name: Committed Tree Builds
      run: python3 test_suite/clean_checkout.py

    - name: Run Conformance Suite
      run: python3 test_suite/conformance.py

    # Compiles every fenced code block in README.md and
    # LANGUAGE_SPECIFICATION.md. Fails when documentation drifts away from
    # what the compiler actually accepts.
    - name: Verify Documentation Examples
      run: python3 test_suite/doc_examples.py

    # The stdlib must parse with the compiler that ships alongside it.
    # Stage 1 of self-hosting: the Strata-written lexer must produce a
    # byte-identical token stream to the Python lexer across the whole corpus.
    - name: Lexer Differential (Strata vs Python oracle)
      run: python3 test_suite/lexer_diff.py

    # The backend C compiler is part of the toolchain, and gcc and clang
    # disagree: clang 16+ rejects implicit function declarations that gcc only
    # warns about. Running the suites under both is what catches that, and it
    # is why this job previously passed locally and failed here.
    # Stage 2 of self-hosting: the Strata-written parser must produce an
    # identical syntax tree to the Python parser.
    - name: Parser Differential (Strata vs Python oracle)
      run: python3 test_suite/parser_diff.py

    # Stage 3 of self-hosting: the Strata-written type checker must emit the
    # same diagnostics — codes, locations, messages and order — as the oracle,
    # over clean code and over one deliberately broken program per rule.
    - name: Type Checker Differential (Strata vs Python oracle)
      run: python3 test_suite/typecheck_diff.py

    # Stage 4: emitted C compared byte for byte.
    - name: Code Generator Differential (Strata vs Python oracle)
      run: python3 test_suite/codegen_diff.py

    # The grammar lives in two places because Linguist and the VS Code
    # marketplace want it in different shapes. Two copies drift.
    - name: Grammar Is One Grammar
      run: python3 test_suite/grammar_sync.py

    # The Android and iOS shells read the same display list from the same five
    # functions. Nothing makes them agree except care, and care does not
    # survive six months.
    # The difference between a language for batch jobs and one for servers.
    # Measured, not trusted: the same work with and without resets.
    # No exceptions, so the accounting is at exit: a failure nobody looked
    # at must not leave the process claiming success.
    - name: Unchecked Errors Are Loud
      run: python3 test_suite/unchecked_errors_are_loud.py

    # A table emptied and refilled must not grow, and must not lose the
    # strings it was given.
    - name: Deleted Rows Are Reclaimed
      run: python3 test_suite/deleted_rows_are_reclaimed.py

    - name: Scratch Memory Is Given Back
      run: python3 test_suite/scratch_is_constant_memory.py

    - name: Phone Shells In Step
      run: python3 test_suite/shell_sync.py

    # The bridge the phone shells call has to keep compiling. It has no main,
    # so this proves the compiler still emits a linkable object.
    - name: Phone Bridge Compiles
      run: |
        bin/strata build apps/orders_mobile/src/host.sta \
          -o apps/orders_mobile/build/host
        test -f apps/orders_mobile/build/host.o

    # Stage 5: the build decisions, not just the code. A program's libraries
    # come from its own `foreign ... link` declarations, so the two compilers
    # must reach the same linker command from the same source.
    - name: Link Command Differential (Strata vs Python oracle)
      run: python3 test_suite/link_libs_diff.py

    # Stage 6: the build itself. The driver assembles the C compiler command
    # in Strata; it must be the same command, and produce the same file.
    - name: Compiler Invocation Differential (Strata vs Python oracle)
      run: python3 test_suite/cc_command_diff.py

    - name: Driver Builds What The Bootstrap Builds
      run: python3 test_suite/driver_build_diff.py

    - name: Machine-Readable Diagnostics Differential (Strata vs Python oracle)
      run: python3 test_suite/json_diag_diff.py

    # The claim that a table need not fit in memory, measured rather than
    # asserted: the same file both ways, with peak memory compared.
    - name: A Scan Is Constant Memory
      run: python3 test_suite/scan_is_constant_memory.py

    # The same question one level down: a service reading a damaged file.
    - name: Damaged Data Is Refused, Not Misread
      run: python3 test_suite/malformed_data.py

    # Break valid programs on purpose. Four bugs in one week were the error
    # path being untested; this goes looking rather than waiting for a fifth.
    - name: Malformed Input Is Rejected, Not Crashed On
      run: python3 test_suite/malformed_input.py

    # `strata check` says exactly what it said when it was a Python script.
    - name: strata check Is Unchanged And Needs No Python
      run: python3 test_suite/check_cli_diff.py

    # Two projects sharing a library, from an empty directory: declare,
    # resolve, build against it, change the library and see the change.
    - name: A Project Can Depend On Another Project
      run: python3 test_suite/journey_dependency.py

    # examples/ is what someone reads first, and nothing built it until a
    # file there was found to compile and then crash.
    - name: Every Example Builds And Runs
      run: python3 test_suite/examples_run.py

    # Equivalence is not use. This is the step that says the toolchain
    # actually reaches for the driver, and that the way back still works.
    - name: strata build Runs The Self-Hosted Driver
      run: python3 test_suite/toolchain_uses_driver.py

    # The proof that the bootstrap can be retired: the Strata front end,
    # rebuilt from C it generated itself, reproduces that C exactly.
    - name: Self-Hosting Fixpoint
      run: python3 test_suite/fixpoint.py

    - name: Conformance Under clang
      run: STRATA_CC=clang python3 test_suite/conformance.py

    - name: Documentation Under clang
      run: STRATA_CC=clang python3 test_suite/doc_examples.py

    # The wasm backend needs clang with a wasm32 target, which the runner has
    # and a gcc-only machine does not. The suite skips there and runs here.
    - name: WebAssembly Target
      run: python3 test_suite/wasm_target.py

    # The language's own test blocks, run rather than only type-checked.
    - name: Run Strata Verify Blocks
      run: ./bin/strata test test_suite/verify_cases

    # Parsing was the old claim and it was not worth making: seven modules
    # parsed fine and failed at the C linker. This builds and runs them.
    - name: Standard Library Compiles, Links And Runs
      run: python3 test_suite/stdlib_compiles.py

    # A formatter nobody runs is a formatter that drifts. This fails the build
    # if any tracked source is not in canonical form.
    - name: Source Is Canonically Formatted
      run: |
        ./bin/strata fmt --check $(find std compiler examples test_suite \
          -name '*.sta' -not -path '*unimplemented*')

    - name: Formatting Preserves Meaning
      run: python3 test_suite/fmt.py

    # A project builds as a project, and the service it produces serves.
    - name: Project Builds And The Service Serves
      run: python3 test_suite/project_build.py

    # The whole journey, not its parts: sign in, look, create, close, sign out,
    # and be refused afterwards.
    - name: Journey — Run The Orders Desk
      run: python3 test_suite/journey_orders.py

    # The second journey: a developer clones, adds a column, watches the build
    # break at every insert, lets the repair loop close it, and finds the data
    # written before the change still loads. It runs against an export of HEAD,
    # so it is what a clone gets.
    - name: Journey — Change The System
      run: python3 test_suite/journey_change.py

    # The third journey: two clients at once, a slow client, a client that
    # walks away, a malformed request, ten writes arriving together, a restart
    # with live data, and 2000 rows. It prints the measured numbers.
    - name: Journey — Survive Contact
      run: python3 test_suite/journey_survive.py

    # A second, differently-shaped application: a command-line tool that also
    # answers JSON, with no pages, no forms and no session. It is the check
    # that the language is not shaped by its only program.
    - name: The Second Application
      run: python3 test_suite/journey_ledger.py

    # Stage 10: could anyone run this? One line per request on stdout, a form
    # from somewhere else refused, a guessed password locking the account, and
    # a flood answered 503 rather than forked.
    - name: Journey — Operate It
      run: python3 test_suite/journey_operate.py

    # Could somebody else use this? Installs the toolchain into a throwaway
    # prefix, builds a project from a directory that is neither the repository
    # nor the install, then deletes the source tree and builds again. Also
    # checks the editor extension's diagnostic parser against output the
    # compiler produces during the run rather than a pasted sample.
    - name: Journey — Somebody Else Installs It
      run: python3 test_suite/journey_install.py

    # A table in a real database rather than a tab-separated file: the same
    # schema, the same queries, the same pages, a different path. Also checks
    # that a program which does NOT import the module gains no libpq
    # dependency, which is the whole basis of the design.
    - name: Journey — A Table In PostgreSQL
      env:
        STRATA_TEST_DB: postgres://postgres:strata@127.0.0.1:5432/strata_test
      run: python3 test_suite/journey_postgres.py

    # The same rules on the server and on a phone's processor, and a screen
    # Strata draws itself. The cross-compiler and emulator are installed so
    # the ARM half runs rather than skipping -- a suite that reports OK having
    # done nothing is worse than no suite.
    - name: Install An ARM64 Cross-Compiler And Emulator
      run: sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

    - name: Journey — One Language, Server And Phone
      run: python3 test_suite/journey_mobile.py

    # What a developer runs before deciding whether to keep going: every
    # command the generated README offers, against a project `strata new` just
    # made, plus `strata check` over this repository's own sources.
    - name: The First Hour
      run: python3 test_suite/first_hour.py

    # The repair loop reads the compiler's JSON diagnostics. Every change to a
    # diagnostic's shape is a chance to break it silently, so the contract is
    # checked here rather than discovered in a demo.
    - name: Autonomous Repair Loop
      run: python3 test_suite/self_repair.py

    - name: Reject Unimplemented Tools On PATH
      run: |
        allowed="strata strata-lexer strata-parser"
        fail=0
        for f in bin/*; do
          name=$(basename "$f")
          case " $allowed " in
            *" $name "*) ;;
            *) echo "::error file=$f::$name is not an approved tool"; fail=1 ;;
          esac
        done
        exit $fail

    # Nothing in this repository may assert a capability that does not exist.
    #
    # The audit of 15 September removed a lockfile declaring dependencies from
    # a registry that was never built (with a shell script spliced into it that
    # printed "Fetching package 'crypto' v2.4.1 from corporate hub" and did
    # nothing), a Kubernetes manifest deploying an image that was never
    # published, Terraform never applied, twelve tools that printed success
    # without working, a submodule with no .gitmodules, and four manuals
    # describing a 5-year LTS programme for a language whose first application
    # was written the day before.
    #
    # This is the gate that stops them coming back. Each pattern names
    # something that was removed because nothing ran it.
    - name: No Unbacked Claims
      run: |
        fail=0
        note() { echo "::error::$1"; fail=1; }

        # Strata.lock was on this list: the old one named a registry that did
        # not exist. It is a real artefact now -- written by `strata deps` from
        # a project's declared dependencies, and covered by
        # test_suite/journey_dependency.py -- so the rule is no longer "it must
        # not exist" but "it must not exist at the root of this repository,
        # which declares no dependencies".
        [ -e Strata.lock ] && note "Strata.lock at the repository root: this project declares no dependencies, so nothing should have written one"

        for f in deploy/production_k8s.yaml deploy/cluster.tf \
                 deploy/run_cloud_deploy.sh deploy_container.sh \
                 test_compiler.sh ARCHITECTURAL_MANUAL.md \
                 DOCUMENTATION_MANIFESTO.md ONBOARDING_WORKSHOP.md \
                 RELEASE_PROCESS.md; do
          [ -e "$f" ] && note "$f was removed by the claims audit; it described something nothing runs"
        done
        [ -d bin/unimplemented ] && note "bin/unimplemented/ was removed; a tool that prints success without working does not belong in the repository"
        [ -d client-ledger-service ] && note "client-ledger-service/ was removed; it was a stub with a fabricated Strata.toml"

        # A gitlink with no .gitmodules gives a clone an empty directory.
        if git ls-files -s | grep -q '^160000'; then
          [ -f .gitmodules ] || note "a submodule is tracked with no .gitmodules; a clone would get an empty directory"
        fi

        # Words that only ever appeared in claims nothing backed.
        #
        # Source and configuration only. This check has now failed three times
        # on prose that was explaining the removal rather than making the
        # claim — a rewritten specification quoting the old wording, and a test
        # file's own docstring. A guard that cannot tell a claim from a
        # description of a claim is a guard that trains people to ignore it.
        for pat in "registry+hub" "UNVERIFIED-no-checksum" "corporate hub" "4KB Fiber" "from hub;"; do
          # The quarantine directories are excluded: their READMEs say plainly
          # that nothing in them works, which is the honest way to keep code
          # that describes a runtime nobody built.
          hits=$(git grep -l -F "$pat" -- '*.sta' '*.toml' '*.lock' '*.yaml' \
                 '*.tf' 'bin/*' ':!*unimplemented*' || true)
          [ -n "$hits" ] && note "\"$pat\" is back, in: $hits"
        done

        exit $fail

    # The image is built and the service inside it is asked for a page. The
    # previous step here checked that a Dockerfile existed — and the one that
    # existed cloned "https://github.com" and built CPython. Checking that a
    # file is present is not checking that it works.
    - name: Image Builds And The Container Serves
      run: |
        docker build -t strata-orders:ci .
        docker run -d --name orders-ci -p 8080:8080 strata-orders:ci
        for i in $(seq 1 30); do
          if curl -fsS -o /dev/null http://127.0.0.1:8080/login; then ok=1; break; fi
          sleep 1
        done
        if [ "${ok:-0}" != "1" ]; then
          echo "::error::the container did not serve /login within 30s"
          docker logs orders-ci || true
          exit 1
        fi
        curl -fsS http://127.0.0.1:8080/login | grep -q "password" \
          || { echo "::error::/login did not render the sign-in form"; exit 1; }
        docker rm -f orders-ci
