# The public demo, built by the compiler it demonstrates.
#
# The two pages under site/public/ are not checked in: they are produced on
# every push by `strata build && ./build/site`, from the layout blocks in
# site/src/views.sta and the rows in site/src/main.sta. A page that stopped
# building would stop deploying, which is the only way a demo stays honest.
name: Public demo site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Render the site with Strata and publish it
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build the toolchain
      run: bash tools/install.sh

    - name: Render the pages
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        cd site
        mkdir -p public
        strata build
        ./build/site
        test -s public/plans.html
        test -s public/account.html
        test -s public/bill.html
        test -s public/index.html

    # The demo's whole claim is that one rename breaks every tier at once. If
    # that stopped being true the site would still deploy and still look fine,
    # which is the failure worth catching.
    - name: One rename breaks the web page and the phone screen
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        cd site
        cp src/schema.sta /tmp/schema.bak
        sed -i 's/float used_gb;/float data_used_gb;/' src/schema.sta
        out="$(strata build 2>&1 || true)"
        cp /tmp/schema.bak src/schema.sta
        # Counted, not grepped for a filename. Searching the output for
        # "phone.sta" stayed green while the compiler was catching two of
        # that file's three uses and calling it complete — a gate that
        # cannot see the regression it exists to catch. These numbers are
        # every use of the column in the demo, so a compiler that stops
        # finding one of them fails here.
        web="$(printf '%s\n' "$out" | grep -cE '^E004 src/views\.sta' || true)"
        phone="$(printf '%s\n' "$out" | grep -cE '^E004 src/phone\.sta' || true)"
        data="$(printf '%s\n' "$out" | grep -cE '^E00[0-9] [0-9]+:' || true)"
        total="$(printf '%s\n' "$out" | grep -cE '^E00[0-9] ' || true)"
        echo "web page: $web   phone screen: $phone   data: $data   total: $total"
        [ "$web"   = "3" ] || { echo "::error::expected 3 failures in src/views.sta, got $web"; exit 1; }
        [ "$phone" = "3" ] || { echo "::error::expected 3 failures in src/phone.sta, got $phone"; exit 1; }
        [ "$data"  = "2" ] || { echo "::error::expected 2 failures in the data, got $data"; exit 1; }
        [ "$total" = "8" ] || { echo "::error::expected 8 failures in all, got $total"; exit 1; }
        echo "one rename, eight failures, across the data, the rules, the web page and the phone screen"

    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site/public

    - id: deploy
      uses: actions/deploy-pages@v4
